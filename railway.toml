# Railway 部署配置
# 用法：railway 控制台 "New Project" → "Deploy from GitHub repo"，
# 或安装 Railway CLI 后在本目录执行 `railway up`。
# Railway 会自动读取 package.json 的 start 脚本并注入 PORT。

[deploy]
startCommand = "node server/index.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 10

[build]
# 零依赖，跳过构建
builder = "nixpacks"
buildCommand = "echo 'no build needed'"

[variables]
JWT_SECRET = "change-me-in-railway-dashboard"
HOST = "0.0.0.0"
