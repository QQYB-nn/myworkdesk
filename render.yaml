# Render 部署配置（Blueprint）
# 用法：在 Render 控制台 "New" → "Blueprint" → 关联本仓库即可，无需手动填命令。
services:
  - type: web
    name: worktable
    runtime: node
    plan: free
    # 零依赖项目无需安装/构建，平台仍会执行 npm ci 的等价步骤，
    # 但 package.json 没有 dependencies，因此很快完成。
    buildCommand: "echo 'no build needed'"
    startCommand: "node server/index.js"
    # Render 会自动注入 PORT 环境变量，server/index.js 已兼容
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: JWT_SECRET
        generateValue: true   # 平台自动生成随机密钥；也可在控制台改为固定值
      - key: HOST
        value: "0.0.0.0"
